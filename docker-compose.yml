services:
  postgres:
    image: postgres:16-alpine
    container_name: dukasmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dukasmart
      POSTGRES_USER: dukasmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dukasmart_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukasmart -d dukasmart"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  dukasmart_postgres_data:
