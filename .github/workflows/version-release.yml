name: GitHub release version

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next GitHub tag
        id: version
        run: |
          git fetch --tags --force
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            next_tag="v0.1.0"
          else
            version_no_v=${latest#v}
            IFS='.' read -r major minor patch <<< "$version_no_v"
            patch=$((patch + 1))
            next_tag="v${major}.${minor}.${patch}"
          fi

          echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"

      - name: Push Git tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" || true
          git push origin "${{ steps.version.outputs.tag }}" || true
          gh release create "${{ steps.version.outputs.tag }}" --generate-notes --verify-tag || true

      - name: Set app version for build
        run: echo "NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.tag }}" >> "$GITHUB_ENV"
